services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-web
    ports:
      - "8080:80"
    restart: unless-stopped

  course:
    build:
      context: ./course
      dockerfile: Dockerfile
    container_name: course-web
    ports:
      - "8081:80"
    restart: unless-stopped